name: Refresh stats and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # daily, after nflverse's overnight update
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Past seasons never change, so keep the ~300 MB of nflverse downloads
      # between runs. The build re-downloads the current and previous season.
      - id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nflverse
          key: nflverse-${{ steps.week.outputs.w }}
          restore-keys: nflverse-

      - name: Test the data build on fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build the stat files from nflverse
        run: python scripts/build_data.py "$RUNNER_TEMP/nflverse" data/legends.json data/wiki_teams.json data

      # Runs before anything is published: if nflverse renames a column or a
      # pool comes out empty, these fail and the last good build stays live.
      - name: Test rules, eligibility and data against the new build
        run: node --test tests/*.test.js

      # The stat files are built fresh every run and deployed, not committed,
      # so the repo stays small. A one-line version stamp is committed when the
      # data changes, which also keeps the daily schedule from going idle.
      - name: Commit the data version stamp
        run: |
          python3 -c "import json;print(json.load(open('data/meta.json'))['v'])" > data/version.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/version.txt
          git diff --cached --quiet || { git commit -m "Refresh stats"; git push; }

      - name: Collect the site
        run: |
          mkdir -p _site/data
          cp index.html favicon.svg _site/
          cp -R css js _site/
          cp data/meta.json data/players.json data/teams.json _site/data/
          cp -R data/scopes _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
